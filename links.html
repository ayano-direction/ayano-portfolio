<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYANO | Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-bg: #f0eeec;
      --color-bg-alt: #d5d0cc;
      --color-bg-light: #e8e5e2;
      --color-brown: #6b6056;
      --color-text: #5a5552;
      --color-text-dark: #2e2b29;
      --color-white: #fafaf9;
      --font-en: 'Cormorant Garamond', serif;
      --font-jp: 'Noto Sans JP', sans-serif;
      --font-jp-serif: 'Noto Serif JP', serif;
    }

    body {
      font-family: var(--font-jp);
      color: var(--color-text);
      background: var(--color-bg);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vh;
      height: 100vw;
      transform: translate(-50%, -50%) rotate(90deg);
      background: url('images/1240402.jpg') center center / cover no-repeat;
      z-index: -2;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(240, 238, 236, 0.82);
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
    }

    .profile {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .profile-name {
      font-family: var(--font-en);
      font-size: 2rem;
      font-weight: 300;
      color: var(--color-text-dark);
      letter-spacing: 0.25em;
    }

    .profile-title {
      font-family: var(--font-jp-serif);
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--color-brown);
      letter-spacing: 0.15em;
    }

    .profile-desc {
      font-size: 0.82rem;
      font-weight: 300;
      line-height: 2;
      color: var(--color-text);
      letter-spacing: 0.04em;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--color-bg-alt);
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .link-button {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
      padding: 1.1rem 1.5rem;
      background: var(--color-white);
      border: 1px solid rgba(107, 96, 86, 0.12);
      border-radius: 4px;
      text-decoration: none;
      color: var(--color-text-dark);
      transition: all 0.3s ease;
    }

    .link-button:hover {
      border-color: rgba(107, 96, 86, 0.3);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(107, 96, 86, 0.08);
    }

    .link-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      opacity: 0.6;
    }

    .link-text {
      flex: 1;
    }

    .link-label {
      font-family: var(--font-jp);
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.06em;
    }

    .link-sub {
      font-size: 0.72rem;
      font-weight: 300;
      color: var(--color-text);
      margin-top: 0.15rem;
      letter-spacing: 0.02em;
    }

    .link-arrow {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      opacity: 0.3;
    }

    .link-button--featured {
      background: var(--color-brown);
      border-color: var(--color-brown);
      color: var(--color-white);
    }

    .link-button--featured .link-label {
      color: var(--color-white);
      font-weight: 500;
    }

    .link-button--featured .link-sub {
      color: #e6d5dc;
    }

    .link-button--featured .link-icon {
      opacity: 0.85;
    }

    .link-button--featured .link-arrow {
      opacity: 0.5;
    }

    .link-button--featured:hover {
      background: #5a5047;
      border-color: #5a5047;
    }

    .nowrap {
      white-space: nowrap;
    }

    .footer-text {
      font-family: var(--font-en);
      font-size: 0.7rem;
      font-weight: 300;
      color: var(--color-bg-alt);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      body {
        padding: 2.5rem 1.2rem;
      }

      .profile-name {
        font-size: 1.7rem;
      }

      .link-button {
        padding: 1rem 1.2rem;
      }
    }
  </style>
</head>
<body>
